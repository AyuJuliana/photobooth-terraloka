<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe2">
<title>Your Terraloka Photo</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
<style>
  main {
    max-width: 520px; margin: 0 auto; min-height: 100vh;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;
  }
  .icon { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 16px; line-height: 1.45; max-width: 34ch; }
  .photo {
    width: 100%; border-radius: 24px; overflow: hidden;
    background: var(--card); border: 1px solid var(--card-line);
    box-shadow: 0 20px 44px rgba(61, 40, 24, 0.25);
  }
  .photo { width: auto; max-width: 100%; }
  .photo img { display: block; max-width: 100%; max-height: 58vh; width: auto; height: auto; }
  .actions { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .actions .btn { width: 100%; }
  .hint { font-size: 13px; line-height: 1.5; }
  footer { margin-top: auto; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon.png" alt="Terraloka">
  <div>
    <h1>Your photo is <span class="accent">ready</span></h1>
  </div>
  <p class="sub muted">Thanks for visiting <b>Terraloka</b> — an iPhone and a microscope, turned into an <span class="accent">on-site soil test</span> for Bali's rice farmers.</p>

  <div class="photo"><img id="img" alt="Your photobooth photo"></div>

  <div class="actions">
    <a class="btn" id="download" download>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
      Download photo
    </a>
    <button class="btn ghost" id="share" hidden>Save to Photos / Share</button>
  </div>
  <p class="pill" id="timer" hidden></p>
  <p class="hint muted" id="hint">On iPhone, you can also press and hold the photo and choose “Save to Photos”.</p>

  <footer class="muted">Terraloka · Photobooth</footer>
</main>
<script>
  const id = decodeURIComponent(location.pathname.split('/').pop());

  const gone = () => {
    document.querySelector('main').innerHTML = `
      <img class="icon" src="/icon.png" alt="Terraloka">
      <h1>Time's <span class="accent">up</span></h1>
      <p class="muted">Photos are only kept for a short time and this one is gone. Ask the <span class="accent">booth team</span> to take a new one.</p>`;
  };
  let serverNow = Date.now();
  fetch(`/api/photo?id=${encodeURIComponent(id)}`).then((r) => {
    const d = Date.parse(r.headers.get('date')); if (d) serverNow = d;
    return r.ok ? r.json() : null;
  }).then((photo) => {
    if (!photo) return gone();
    // Booth-laptop photos expire: show a countdown (based on the server clock), then remove the photo.
    if (photo.expiresAt) {
      const deadline = Date.now() + (photo.expiresAt - serverNow), timer = document.getElementById('timer');
      timer.hidden = false;
      const tick = () => {
        const s = Math.ceil((deadline - Date.now()) / 1000);
        if (s <= 0) { clearInterval(t); return gone(); }
        timer.textContent = `⏳ Save it now · disappears in ${s}s`;
      };
      const t = setInterval(tick, 1000); tick();
    }
    document.getElementById('img').src = photo.img;
    const dl = document.getElementById('download');
    dl.href = photo.download;
    dl.setAttribute('download', `terraloka-${id}`);

    // Share sheet lets iPhone users save straight to Photos.
    const shareBtn = document.getElementById('share');
    if (navigator.canShare) {
      fetch(photo.img).then((r) => r.blob()).then((blob) => {
        const file = new File([blob], `terraloka-${id}`, { type: blob.type || 'image/jpeg' });
        if (!navigator.canShare({ files: [file] })) return;
        shareBtn.hidden = false;
        shareBtn.onclick = () => navigator.share({ files: [file], title: 'My Terraloka photo' }).catch(() => {});
      }).catch(() => {});
    }
  });
</script>
</body>
</html>
